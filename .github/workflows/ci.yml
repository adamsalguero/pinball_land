name: CI

on:
  push:
  pull_request:

jobs:
  essential:
    name: Essential flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run e2e

  windows:
    name: Windows install and Electron
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node -v
      - run: npm -v
      - run: npm ci
      - name: Electron install script is allowed
        shell: pwsh
        run: |
          node -e "const a=require('./package.json').allowScripts||{}; const ok=Object.keys(a).some(k => a[k]===true && (k==='electron' || k.startsWith('electron@'))); if(!ok){ console.error('allowScripts does not allow electron'); process.exit(1) } console.log(JSON.stringify(a))"
      - name: Electron binary from npm ci
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules\electron\dist\electron.exe)) {
            Write-Error "npm ci did not install the Electron binary. allowScripts must cover electron so its postinstall runs."
            exit 1
          }
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Update now writes a trace
        shell: pwsh
        run: node scripts/update-now-windows.js
      - name: Cold boot order
        shell: pwsh
        run: node scripts/boot-order-windows.js
      - run: npm run electron-smoke
      - name: Installer dry run
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-beelink.ps1 -DryRun -Kiosk
      - name: Enable autoupdate dry run
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\enable-autoupdate.ps1 -DryRun -Kiosk
      - name: Ensure Chrome
        shell: pwsh
        run: |
          $chrome = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chrome) { Write-Host "Chrome present at $chrome"; exit 0 }
          winget install --id Google.Chrome -e --accept-source-agreements --accept-package-agreements
          if (-not (Test-Path $chrome)) { Write-Error "Google Chrome is not installed"; exit 1 }
      - name: Headed blob playback
        timeout-minutes: 45
        shell: pwsh
        env:
          PINBALL_BLOB_SOAK_MS: "1200000"
        run: node scripts/blob-soak.js
