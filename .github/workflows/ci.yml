name: CI

on:
  push:
  pull_request:

jobs:
  essential:
    name: Essential flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  windows:
    name: Windows install and Electron
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - run: npm run electron-smoke
