<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sprite preview</title>
    <style>
      body { margin: 0; background: #140c09; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="sheet" width="1920" height="1080"></canvas>
    <script src="/motion.js"></script>
    <script>
      const canvas = document.getElementById("sheet");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#1a100c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const motion = window.PinballMotion;
      const size = 78;
      const spiders = [
        { x: 520, y: 280, phase: 0.4 },
        { x: 980, y: 360, phase: 1.6 },
      ];
      const bats = [
        { x: 700, y: 300, flap: 0.2 },
        { x: 1160, y: 250, flap: -0.6 },
      ];
      window.__sprites = { spiders, bats, size };
      for (const spider of spiders) {
        motion.strokeSpiderSilk(ctx, spider, size);
        ctx.save();
        ctx.translate(spider.x, spider.y);
        motion.drawSpider(ctx, size, spider.phase);
        ctx.restore();
      }
      for (const bat of bats) {
        ctx.save();
        ctx.translate(bat.x, bat.y);
        motion.drawBat(ctx, size, bat.flap);
        ctx.restore();
      }
    </script>
  </body>
</html>
