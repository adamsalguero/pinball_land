<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Pinball Land display</title>
    <link rel="stylesheet" href="/display.css" />
  </head>
  <body>
    <main id="screen" class="screen off" aria-live="polite">
      <div id="off" class="panel off-panel" hidden></div>
      <div id="logo" class="panel logo-panel" hidden>
        <img id="logo-image" alt="" />
      </div>
      <div id="board" class="panel board-panel" hidden>
        <header class="board-header">
          <p class="board-kicker">Pinball Land</p>
          <h1 id="board-title">Leaderboard</h1>
        </header>
        <ol id="board-rows" class="board-rows"></ol>
        <p id="board-empty" class="board-empty" hidden>No scores yet</p>
      </div>
    </main>
    <script src="/display.js"></script>
  </body>
</html>
