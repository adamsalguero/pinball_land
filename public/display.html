<!DOCTYPE html>
<html lang="en" data-theme="pinnacle">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Pinball Land display</title>
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/display.css" />
    <link rel="stylesheet" href="/wall.css" />
  </head>
  <body>
    <main id="screen" class="screen" data-mode="off" aria-live="polite">
      <div id="present" class="panel present-panel" hidden>
        <div id="present-waiting" class="present-waiting">
          <p class="present-kicker">Pinball Land</p>
          <h1 id="present-heading" data-fit="3">Share to this screen</h1>
          <p id="present-code" class="present-code" hidden></p>
          <p id="present-instructions" class="present-instructions" data-fit="6"></p>
        </div>
        <video id="present-video" autoplay playsinline hidden></video>
        <img id="present-image" alt="" hidden />
        <iframe id="present-frame" title="Presentation" hidden></iframe>
      </div>
      <div id="video-panel" class="panel video-panel" hidden>
        <video id="wall-video" autoplay muted playsinline></video>
        <p id="video-fallback" class="video-fallback" data-fit="4" hidden>Video</p>
      </div>
      <div id="logo" class="panel logo-panel" hidden>
        <p id="logo-fallback" class="logo-fallback" data-fit="4" hidden></p>
        <img id="logo-image" alt="" hidden />
      </div>
      <div id="amenity" class="panel amenity-panel" hidden>
        <p class="amenity-kicker">Pinnacle Entertainment Center</p>
        <div class="amenity-layout">
          <figure id="amenity-frame" class="amenity-frame" hidden>
            <img id="amenity-photo" alt="" />
          </figure>
          <div class="amenity-copy">
            <h1 id="amenity-headline" data-fit="3"></h1>
            <p id="amenity-body" data-fit="6"></p>
            <p id="amenity-types" class="amenity-types" data-fit="4" hidden></p>
          </div>
        </div>
      </div>
      <div id="board" class="panel board-panel" hidden>
        <div id="machine-art-wrap" class="machine-art-wrap" hidden>
          <img id="machine-art" alt="" hidden />
          <p id="machine-art-fallback" class="machine-art-fallback" hidden></p>
          <video id="machine-video" muted loop playsinline hidden></video>
        </div>
        <div class="board-main">
          <header class="board-header">
            <img id="machine-logo" class="machine-logo" alt="" hidden />
            <p class="board-kicker">Pinnacle Entertainment Center</p>
            <h1 id="board-title" data-fit="1" data-fit-full="1">Leaderboard</h1>
            <p id="board-meta" class="board-meta" data-fit="1" data-fit-full="1" hidden></p>
          </header>
          <div id="podium" class="podium" hidden></div>
          <ol id="board-rows" class="board-rows"></ol>
          <p id="board-empty" class="board-empty" hidden>No scores yet</p>
        </div>
      </div>
      <div id="clock" class="panel clock-panel" hidden>
        <p class="clock-kicker">Pinnacle Entertainment Center</p>
        <p id="clock-time" class="clock-time">00:00</p>
        <p id="clock-event" class="clock-event" data-fit="2"></p>
      </div>
      <div id="pinboard" class="panel pinboard" hidden>
        <div id="pin-wall" class="pin-wall"></div>
        <div class="pin-qr">
          <img id="pin-qr" alt="QR code to post a photo" src="/api/guest-qr" />
          <p>Post a photo</p>
        </div>
      </div>
      <div id="collage" class="panel collage-panel" hidden>
        <div id="collage-grid" class="collage-grid"></div>
      </div>
      <div id="youtube" class="panel yt-panel" hidden></div>
    </main>
    <canvas id="motion"></canvas>
    <script src="/motion.js"></script>
    <script src="/rotation.js"></script>
    <script src="/display.js"></script>
  </body>
</html>
