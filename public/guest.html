<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pinball Land" />
    <meta name="theme-color" content="#62006E" />
    <title>Pinball Land</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/guest-180.png" />
    <link rel="apple-touch-startup-image" href="/icons/guest-splash.png" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/guest.css" />
  </head>
  <body>
    <header class="guest-top">
      <p class="eyebrow">Pinnacle Entertainment Center</p>
      <h1>Pinball Land</h1>
    </header>
    <nav class="guest-tabs" aria-label="Guest">
      <button type="button" data-guest-tab="camera" class="active">Camera</button>
      <button type="button" data-guest-tab="board">Pinboard</button>
      <button type="button" data-guest-tab="scores">Scores</button>
    </nav>
    <main>
      <section id="panel-camera" data-guest-panel="camera">
        <p class="status">Take a photo or choose one from your library.</p>
        <div class="shutter-row photo-actions">
          <button id="take-photo" class="btn primary" type="button">Take Photo</button>
          <button id="choose-photo" class="btn" type="button">Choose Photo</button>
        </div>
        <input id="take-file" type="file" accept="image/*" capture="environment" hidden />
        <input id="choose-file" type="file" accept="image/*" hidden />
        <img id="still" alt="" hidden />
        <label>
          Your name
          <input id="guest-name" maxlength="40" autocomplete="name" placeholder="Optional" />
        </label>
        <label>
          Caption
          <input id="caption" maxlength="80" placeholder="Optional" />
        </label>
        <button id="post" class="btn primary" type="button" disabled>Post to the wall</button>
        <p id="post-status" class="status" role="status"></p>
      </section>
      <section id="panel-board" data-guest-panel="board" hidden>
        <h2>Live pinboard</h2>
        <div id="feed" class="feed"></div>
        <p id="feed-empty" class="status">Approved photos show up here.</p>
      </section>
      <section id="panel-scores" data-guest-panel="scores" hidden>
        <h2>Leaderboard</h2>
        <label>
          Machine
          <select id="machine-picker"></select>
        </label>
        <div id="scores" class="scores"></div>
        <form id="score-form" class="score-form">
          <h2>Submit a score</h2>
          <label>
            Name
            <input id="score-name" maxlength="40" required placeholder="Your name" />
          </label>
          <label>
            Score
            <input id="score-value" inputmode="numeric" required placeholder="2450000" />
          </label>
          <label>
            Photo of the score
            <input id="score-photo" type="file" accept="image/*" capture="environment" />
          </label>
          <button class="btn primary" type="submit">Submit score</button>
          <p id="score-status" class="status" role="status"></p>
        </form>
      </section>
    </main>
    <div id="photo-lightbox" class="lightbox" hidden>
      <button id="photo-lightbox-close" class="lightbox-close" type="button" aria-label="Close">×</button>
      <img id="photo-lightbox-img" alt="" />
      <a id="photo-lightbox-download" class="btn download" href="#">Download</a>
    </div>
    <script src="/guest.js"></script>
  </body>
</html>
