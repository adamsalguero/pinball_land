<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pinball Land" />
    <meta name="theme-color" content="#1a1916" />
    <title>Pinball Land</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/guest-180.png" />
    <link rel="apple-touch-startup-image" href="/icons/guest-splash.png" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/guest.css" />
  </head>
  <body>
    <div id="install-hint" class="install-hint" hidden>
      <p>Add Pinball Land to your Home Screen for the camera and a full-screen pinboard.</p>
      <button id="dismiss-hint" type="button">Got it</button>
    </div>
    <header class="guest-top">
      <p class="eyebrow">Pinnacle Entertainment Center</p>
      <h1>Pinball Land</h1>
    </header>
    <nav class="guest-tabs" aria-label="Guest">
      <button type="button" data-guest-tab="camera" class="active">Camera</button>
      <button type="button" data-guest-tab="board">Pinboard</button>
      <button type="button" data-guest-tab="scores">Scores</button>
    </nav>
    <main>
      <section id="panel-camera" data-guest-panel="camera">
        <div class="stage">
          <video id="preview" autoplay playsinline muted hidden></video>
          <img id="still" alt="" hidden />
          <p id="stage-hint" class="stage-hint">Open the camera, or pick a photo from your library.</p>
        </div>
        <div class="shutter-row">
          <button id="library" class="btn quiet" type="button">Library</button>
          <button id="shutter" class="shutter" type="button" aria-label="Take photo">Take photo</button>
          <button id="flip" class="btn quiet" type="button">Flip</button>
        </div>
        <input id="file" type="file" accept="image/*" capture="environment" multiple hidden />
        <label>
          Your name
          <input id="guest-name" maxlength="40" autocomplete="name" placeholder="Optional" />
        </label>
        <label>
          Caption
          <input id="caption" maxlength="80" placeholder="Optional" />
        </label>
        <button id="post" class="btn primary" type="button" disabled>Post to the wall</button>
        <p id="post-status" class="status" role="status"></p>
      </section>
      <section id="panel-board" data-guest-panel="board" hidden>
        <h2>Live pinboard</h2>
        <div id="feed" class="feed"></div>
        <p id="feed-empty" class="status">Approved photos show up here.</p>
      </section>
      <section id="panel-scores" data-guest-panel="scores" hidden>
        <h2>Tonight</h2>
        <div id="scores" class="scores"></div>
      </section>
    </main>
    <script src="/guest.js"></script>
  </body>
</html>
